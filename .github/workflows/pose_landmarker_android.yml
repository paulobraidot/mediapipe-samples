name: pose_landmarker android

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: examples/pose_landmarker/android

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: examples/pose_landmarker/android

      - name: Prepare APK for upload
        run: cp app/build/outputs/apk/debug/app-debug.apk pose_landmarker.apk
        working-directory: examples/pose_landmarker/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pose_landmarker.apk
          path: examples/pose_landmarker/android/pose_landmarker.apk
